# tests/integration/setup is the reserved location for short-lived fixture
# infrastructure created and destroyed by the integration suites in the
# caller's own account; it is not a deployable pattern and is excluded from
# policy scanning. The smoke suite needs no fixtures today.
skip-path:
  - tests/integration/setup

# CI runs Checkov 3.3.19; the locally available 3.3.10 does not implement
# CKV_AWS_192 at all (confirmed: `checkov -d .` on 3.3.10 does not evaluate
# it, but the 3.3.19 venv installed per the module briefs does).
#
# CKV_AWS_192 ("Ensure WAF prevents message lookup in Log4j2") fails on
# every web ACL this module creates, including the plain root module with no
# example wrapping it (`checkov -d . --skip-path examples --skip-path tests`
# under 3.3.19: 1 failed, exactly this check) and examples/full-featured,
# which already declares a second managed rule group
# (AWSManagedRulesBotControlRuleSet). That is expected, not a resolution
# artifact: the check looks specifically for
# AWSManagedRulesKnownBadInputsRuleSet (the managed rule group carrying the
# Log4Shell rule) among a web ACL's managed_rule_groups, and this module's
# managed_rule_groups is an open map the caller populates. Its default is
# specified as exactly one entry,
# { common = { name = "AWSManagedRulesCommonRuleSet", priority = 1 } }, so a
# bare call is still meaningfully protected without the module silently
# expanding that to a second, undeclared rule group a caller did not ask
# for. A caller who wants Log4Shell protection adds
# AWSManagedRulesKnownBadInputsRuleSet to managed_rule_groups themselves, the
# same way examples/rate-limited-api and examples/full-featured add a second
# managed rule group of their own choosing alongside the default.
skip-check:
  - CKV_AWS_192 # WAF Log4j2 protection — fires on every web ACL this module or its examples create, including the bare default; managed_rule_groups is caller-populated by design and a caller adds AWSManagedRulesKnownBadInputsRuleSet themselves if they want it.
